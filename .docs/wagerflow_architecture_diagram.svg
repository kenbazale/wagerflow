<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A bet command flows through the Bet Service into a Kafka event backbone, which fans out to a Settlement saga and an RG monitor, converges into a CQRS read model and an S3 archive, and feeds a nightly analytics pipeline of Spark, Redshift, and dbt.</desc>
